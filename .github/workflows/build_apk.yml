name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, '1']
  pull_request:
    branches: [main, '1']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms android --org com.cooler1987 --project-name readertest
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: readertest-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
