name: readertest
description: A lightweight Android ebook reader for TXT, EPUB, and Markdown.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^8.1.7
  html: ^0.15.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
